---
layout: default
title: Tags
permalink: /tags/
---
<section class="hero small"><h1><span class="br">&lt;</span> Tags <span class="br">/&gt;</span></h1></section>
<section class="tagidx">
{% assign all_tags = site.tags | sort %}
{% for t in all_tags %}
  <div class="tg" id="{{ t[0] | slugify }}"><h2>#{{ t[0] }} <small>{{ t[1].size }}</small></h2>
  <ul>{% for post in t[1] %}<li><a href="{{ post.url | relative_url }}">{{ post.title }}</a><time>{{ post.date | date: '%d/%m/%Y' }}</time></li>{% endfor %}</ul></div>
{% endfor %}
</section>
